<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e36"/>
      <stop offset="100%" stop-color="#05101f"/>
    </linearGradient>

    <!-- Electric Cyan Gradient for Inner Core -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Ambient Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container App Icon / Tile -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.25" stroke="#1e3a5f" stroke-width="1.5" fill="none"/>

  <!-- Inner Cyan Glowing Accents (Glowing Layer) -->
  <g filter="url(#neonGlow)" opacity="0.95">
    <!-- Left Inner Chevron -->
    <path d="M 27.5 53 L 37.5 37 L 45.5 55" stroke="url(#cyanCore)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right Inner Chevron -->
    <path d="M 46.5 51 L 54.5 69 L 64.5 53" stroke="url(#cyanCore)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Outer Main Circuit Frame (Crisp White / Silver Glow) -->
  <path d="M 37 66 L 19 66 L 37 30 L 55 74 L 73 38 L 55 38" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>

  <!-- Top-Right Terminal Node -->
  <circle cx="55" cy="38" r="4.5" fill="#FFFFFF"/>
  <circle cx="55" cy="38" r="2" fill="#38bdf8"/>

  <!-- Bottom-Left Terminal Node -->
  <circle cx="37" cy="66" r="4.5" fill="#FFFFFF"/>
  <circle cx="37" cy="66" r="2" fill="#38bdf8"/>
</svg>
